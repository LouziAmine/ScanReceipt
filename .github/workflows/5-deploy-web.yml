# Publishes the browser demo to GitHub Pages: https://louziamine.github.io/ScanReceipt/
# Runs after a green CI on master, or by hand. The demo has no camera and no OCR (phone only);
# data stays in the visitor's browser (SQLite in WebAssembly).
#
# One-time setup, once the repository is public: Settings > Pages > Source: "GitHub Actions".
# While the repository is private the job is skipped (Pages needs a paid plan for private repos).
name: "5 · Deploy · Web demo (GitHub Pages)"

on:
  workflow_run:
    workflows: ['1 · CI · Quality & Build']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  NPM_VERSION: 12.0.1
  NG_CLI_ANALYTICS: false

jobs:
  build:
    name: Build web demo
    if: >-
      !github.event.repository.private &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the CI just validated, not whatever master points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      # base href /ScanReceipt/, sql.js WebAssembly bundled, "Web demo" banner on.
      - run: npx ng build --configuration demo
      # GitHub Pages serves 404.html for unknown paths: the Angular router then opens the right screen.
      - run: cp www/index.html www/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
